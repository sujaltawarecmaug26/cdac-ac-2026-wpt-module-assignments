<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Sujal Taware</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-row">
      <a class="brand" href="index.html"><img src="images/profile-avatar.svg" alt="Sujal initials avatar" width="44" height="44"><span>Sujal Taware</span></a>
      <nav id="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a><a href="projects.html">Projects</a><a href="contact.html">Contact</a>
        <a href="https://github.com/sujaltawarecmaug26" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="page-wrap section">
    <div class="projects-intro">
      <p class="eyebrow">Say hello</p><h1>Contact me</h1>
      <p>Have a project idea, an opportunity or a question? Send a short note.</p>
    </div>
    <form class="form-card" id="contact-form" action="https://example.com/contact" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div><label for="full-name">Name</label><input type="text" id="full-name" name="full-name" placeholder="Your full name" required></div>
        <div><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
        <div><label for="contact-date">Preferred contact date</label><input type="date" id="contact-date" name="contact-date"></div>
        <div><label for="enquiry-type">Enquiry type</label><select id="enquiry-type" name="enquiry-type" required><option value="">Choose one</option><option value="job">Job opportunity</option><option value="project">Project collaboration</option><option value="question">General question</option><option value="other">Other</option></select></div>
        <div class="full-width">
          <label>Preferred contact mode</label>
          <div class="radio-line">
            <label><input type="radio" id="contact-email" name="contact-mode" value="email" checked> Email</label>
            <label><input type="radio" id="contact-phone" name="contact-mode" value="phone"> Phone</label>
            <label><input type="radio" id="contact-video" name="contact-mode" value="video"> Video call</label>
          </div>
        </div>
        <div class="full-width"><label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Tell me a little about your enquiry..." required></textarea></div>
        <div class="full-width"><label for="cv-upload">CV upload (optional)</label><input type="file" id="cv-upload" name="cv-upload" accept=".pdf,.doc,.docx"></div>
        <div class="full-width"><label class="check-line"><input type="checkbox" id="consent" name="consent" required> I agree that my details may be used to reply to this message.</label></div>
      </div>
      <button type="submit">Send message</button>
      <button type="reset" style="background:#e2e8f0;color:#172033;margin-left:8px;">Reset form</button>
      <!-- Demo endpoint only: replace example.com with a real server endpoint before production. -->
    </form>
    <section class="section">
      <h2>Find me around Pune</h2>
      <p>This embedded map shows Pune city as a general location.</p>
      <iframe title="Map of Pune, Maharashtra" loading="lazy" src="https://maps.google.com/maps?q=Pune%2C%20Maharashtra&t=&z=11&ie=UTF8&iwloc=&output=embed" allowfullscreen></iframe>
    </section>
  </main>
  <footer class="site-footer">Thanks for stopping by.</footer>
</body>
</html>
